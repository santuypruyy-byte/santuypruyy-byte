name: Generate Animation

on:
  # Jalankan otomatis setiap 24 jam sekali
  schedule:
    - cron: "0 */24 * * *"

  # Bisa juga dijalankan secara manual dari tab Actions
  workflow_dispatch:

  # Jalankan setiap ada push ke branch main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Unduh repository
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Proses pembuatan animasi snake/pacman dari kontribusi GitHub kamu
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: santuypruyy-byte
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Masukkan hasil file SVG ke branch output
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
